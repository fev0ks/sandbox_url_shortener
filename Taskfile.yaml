version: '3'

vars:
  GO_VERSION: '1.25'
  GOLANGCI_LINT_VERSION: 'v2.8.0'
  GCI_VERSION: 'v0.13.7'
  GOFUMPT_VERSION: 'v0.9.2'

  BIN_DIR: '{{.ROOT_DIR}}/bin'
  GOLANGCI_LINT: '{{.BIN_DIR}}/golangci-lint'
  GCI: '{{.BIN_DIR}}/gci'
  GOFUMPT: '{{.BIN_DIR}}/gofumpt'

tasks:
  install-formatters:
    desc: "Install gofumpt and gci into ./bin"
    cmds:
      - |
        mkdir -p {{.BIN_DIR}}
        [ -f {{.GOFUMPT}} ] || {
          echo 'Installing gofumpt {{.GOFUMPT_VERSION}}...'
          GOBIN={{.BIN_DIR}} go install mvdan.cc/gofumpt@{{.GOFUMPT_VERSION}}
        }
        [ -f {{.GCI}} ] || {
          echo 'Installing gci {{.GCI_VERSION}}...'
          GOBIN={{.BIN_DIR}} go install github.com/daixiang0/gci@{{.GCI_VERSION}}
        }
    status:
      - test -x {{.GOFUMPT}}
      - test -x {{.GCI}}

  format:
    desc: "Format Go code with gofumpt and gci"
    deps: [install-formatters]
    cmds:
      - |
        echo "Formatting with gofumpt..."
        find . -type f -name '*.go' ! -path '*/mocks/*' -exec {{.GOFUMPT}} -extra -w {} +
      - |
        echo "Sorting imports with gci..."
        find . -type f -name '*.go' ! -path '*/mocks/*' -exec {{.GCI}} write -s standard -s default -s "prefix(sandbox_url_shortener)" {} +

  install-golangci-lint:
    desc: "Install golangci-lint into ./bin"
    cmds:
      - |
        [ -f {{.GOLANGCI_LINT}} ] || {
          mkdir -p {{.BIN_DIR}}
          echo "Installing golangci-lint {{.GOLANGCI_LINT_VERSION}}..."
          GOBIN={{.BIN_DIR}} go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
        }
    status:
      - test -x {{.GOLANGCI_LINT}}

  lint:
    desc: "Run golangci-lint for the module"
    deps: [install-golangci-lint]
    cmds:
      - '{{.GOLANGCI_LINT}} run ./... --config=.golangci.yml'

  test:
    desc: "Run all Go tests"
    cmds:
      - go test ./... -v

  build:
    desc: "Build API and worker binaries"
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -o {{.BIN_DIR}}/api-http-stdlib ./cmd/api-http-stdlib
      - go build -o {{.BIN_DIR}}/worker ./cmd/worker

  verify:
    desc: "Run lint, tests, and builds"
    deps: [lint, test, build]
