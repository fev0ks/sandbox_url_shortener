version: '3'

vars:
  GO_VERSION: '1.25'
  GOLANGCI_LINT_VERSION: 'v2.8.0'
  GCI_VERSION: 'v0.13.7'
  GOFUMPT_VERSION: 'v0.9.2'

  BIN_DIR: '{{.ROOT_DIR}}/bin'
  COMPOSE_FILE: '{{.ROOT_DIR}}/deploy/docker-compose/docker-compose.yml'
  KIND_CLUSTER: sandbox-url-shortener
  KIND_CONFIG: '{{.ROOT_DIR}}/deploy/kind/cluster.yaml'
  K8S_NAMESPACE: sandbox-url-shortener
  HELM_RELEASE: sandbox-url-shortener
  HELM_CHART: '{{.ROOT_DIR}}/deploy/helm/url-shortener'
  SHORTENER_IMAGE: sandbox-url-shortener/shortener:local
  IDENTITY_IMAGE: sandbox-url-shortener/identity:local
  ANALYTICS_IMAGE: sandbox-url-shortener/analytics:local
  GOLANGCI_LINT: '{{.BIN_DIR}}/golangci-lint'
  GCI: '{{.BIN_DIR}}/gci'
  GOFUMPT: '{{.BIN_DIR}}/gofumpt'
  WEB_DIR: '{{.ROOT_DIR}}/services/web'

tasks:
  install-formatters:
    desc: "Install gofumpt and gci into ./bin"
    cmds:
      - |
        mkdir -p {{.BIN_DIR}}
        [ -f {{.GOFUMPT}} ] || {
          echo 'Installing gofumpt {{.GOFUMPT_VERSION}}...'
          GOBIN={{.BIN_DIR}} go install mvdan.cc/gofumpt@{{.GOFUMPT_VERSION}}
        }
        [ -f {{.GCI}} ] || {
          echo 'Installing gci {{.GCI_VERSION}}...'
          GOBIN={{.BIN_DIR}} go install github.com/daixiang0/gci@{{.GCI_VERSION}}
        }
    status:
      - test -x {{.GOFUMPT}}
      - test -x {{.GCI}}

  format:
    desc: "Format Go code with gofumpt and gci"
    deps: [install-formatters]
    cmds:
      - |
        echo "Formatting with gofumpt..."
        find . -type f -name '*.go' ! -path '*/mocks/*' -exec {{.GOFUMPT}} -extra -w {} +
      - |
        echo "Sorting imports with gci..."
        find . -type f -name '*.go' ! -path '*/mocks/*' -exec {{.GCI}} write -s standard -s default -s "prefix(sandbox_url_shortener)" {} +

  install-golangci-lint:
    desc: "Install golangci-lint into ./bin"
    cmds:
      - |
        [ -f {{.GOLANGCI_LINT}} ] || {
          mkdir -p {{.BIN_DIR}}
          echo "Installing golangci-lint {{.GOLANGCI_LINT_VERSION}}..."
          GOBIN={{.BIN_DIR}} go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
        }
    status:
      - test -x {{.GOLANGCI_LINT}}

  lint:
    desc: "Run golangci-lint for the module"
    deps: [install-golangci-lint]
    cmds:
      - '{{.GOLANGCI_LINT}} run ./... --config=.golangci.yml'

  test:
    desc: "Run all Go tests"
    cmds:
      - go test ./... -v

  build:
    desc: "Build all Go service binaries"
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -o {{.BIN_DIR}}/shortener ./services/shortener/cmd/shortener
      - go build -o {{.BIN_DIR}}/identity ./services/identity/cmd/identity
      - go build -o {{.BIN_DIR}}/identity-maintenance ./services/identity/cmd/identity-maintenance
      - go build -o {{.BIN_DIR}}/analytics ./services/analytics/cmd/analytics
      - go build -o {{.BIN_DIR}}/mcp-logs ./services/mcp-logs/cmd/mcp-logs

  identity:cleanup:
    desc: "Run identity retention cleanup once using DB_DSN and identity retention env"
    cmds:
      - go run ./services/identity/cmd/identity-maintenance cleanup

  identity:migrate:
    desc: "Run identity PostgreSQL migrations with the identity migration table"
    cmds:
      - make identity-migrate-up

  web-install:
    desc: "Install web frontend dependencies"
    dir: '{{.WEB_DIR}}'
    cmds:
      - |
        find . -name .DS_Store -delete 2>/dev/null || true
        rm -rf .node_modules.delete.* 2>/dev/null || true
        if [ -e node_modules ]; then
          trash=".node_modules.delete.$(date +%s).$$"
          mv node_modules "$trash"
          rm -rf "$trash" 2>/dev/null || true
        fi
        test ! -e node_modules
      - npm ci
      - |
        find . -name .DS_Store -delete 2>/dev/null || true
        rm -rf .node_modules.delete.* 2>/dev/null || true

  web-build:
    desc: "Build the Next.js frontend"
    dir: '{{.WEB_DIR}}'
    deps: [web-install]
    cmds:
      - npm run build

  verify-go:
    desc: "Run the Go verification flow"
    cmds:
      - task: lint
      - task: test
      - task: build

  verify-web:
    desc: "Run the web verification flow"
    cmds:
      - task: web-build

  verify:
    desc: "Run the canonical local verification flow"
    cmds:
      - task: verify-go
      - task: verify-web

  image-build:
    desc: "Build the runtime images used by the local Docker Compose stack"
    cmds:
      - task: verify
      - docker compose -f {{.COMPOSE_FILE}} build shortener identity analytics web mcp-logs

  deploy:
    desc: "Build images, run migrations, start the stack, and execute smoke checks"
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} up --build -d
      - task: mcp:db:prepare
      - task: smoke

  mcp:start:
    desc: "Build and start only the HTTP MCP service, even when upstreams are unavailable"
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} up -d --build --no-deps mcp-logs

  mcp:restart:
    desc: "Rebuild and recreate only MCP without restarting its clients or other services"
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} up -d --build --force-recreate --no-deps mcp-logs

  mcp:status:
    desc: "Show HTTP MCP service status"
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} ps -a mcp-logs

  mcp:logs:
    desc: "Follow HTTP MCP service logs"
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} logs --follow --tail=100 mcp-logs

  mcp:stop:
    desc: "Stop only the HTTP MCP service"
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} stop mcp-logs

  mcp:db:prepare:
    desc: "Prepare the dedicated PostgreSQL reader and audited views on an existing local database"
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} run --rm mcp-db-prepare

  smoke:
    desc: "Run HTTP smoke checks against the local stack"
    cmds:
      - |
        set -eu
        web_port="${WEB_PORT:-3000}"
        check_url() {
          name="$1"
          url="$2"
          echo "Checking ${name} at ${url}"
          attempt=1
          while [ "$attempt" -le 30 ]; do
            if curl -fsS "$url" >/dev/null; then
              echo "${name} is ready"
              return 0
            fi
            sleep 2
            attempt=$((attempt + 1))
          done
          echo "${name} failed smoke check: ${url}" >&2
          return 1
        }

        check_url shortener http://localhost:8080/health/ready
        check_url identity http://localhost:8081/health/ready
        check_url analytics http://localhost:9090/health/ready
        check_url mcp http://localhost:8090/health/ready
        check_url web "http://localhost:${web_port}"

  load:smoke:
    desc: "Run the k6 smoke scenario"
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} run --rm k6 run /scripts/scenarios/smoke.js

  load:steady:
    desc: "Run safe steady redirect load"
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} run --rm k6 run /scripts/scenarios/redirect-steady.js

  load:mixed:
    desc: "Run safe mixed create and redirect load"
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} run --rm k6 run /scripts/scenarios/mixed-create-redirect.js

  load:spike:
    desc: "Run conservative spike redirect load"
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} run --rm k6 run /scripts/scenarios/spike-redirect.js

  load:saturation:
    desc: "Run guarded saturation load; requires ALLOW_SATURATION=1"
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} run --rm -e ALLOW_SATURATION k6 run /scripts/scenarios/saturation.js

  load:steady:metrics:
    desc: "Run steady redirect load and export k6 metrics to Prometheus"
    cmds:
      - |
        test_id="${TEST_ID:-steady-local}"
        docker compose -f {{.COMPOSE_FILE}} run --rm k6 run \
          -o experimental-prometheus-rw \
          --tag testid="$test_id" \
          /scripts/scenarios/redirect-steady.js

  load:mixed:metrics:
    desc: "Run mixed create/redirect load and export k6 metrics to Prometheus"
    cmds:
      - |
        test_id="${TEST_ID:-mixed-local}"
        docker compose -f {{.COMPOSE_FILE}} run --rm k6 run \
          -o experimental-prometheus-rw \
          --tag testid="$test_id" \
          /scripts/scenarios/mixed-create-redirect.js

  load:spike:metrics:
    desc: "Run spike redirect load and export k6 metrics to Prometheus"
    cmds:
      - |
        test_id="${TEST_ID:-spike-local}"
        docker compose -f {{.COMPOSE_FILE}} run --rm k6 run \
          -o experimental-prometheus-rw \
          --tag testid="$test_id" \
          /scripts/scenarios/spike-redirect.js

  k8s:dependencies:
    desc: "Start Compose-backed dependencies for the local kind runtime"
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} up -d postgres redis clickhouse
      - docker compose -f {{.COMPOSE_FILE}} run --rm migrate

  k8s:cluster:create:
    desc: "Create the local kind cluster if it does not exist"
    cmds:
      - |
        if kind get clusters | grep -qx '{{.KIND_CLUSTER}}'; then
          echo "kind cluster {{.KIND_CLUSTER}} already exists"
        else
          kind create cluster --config {{.KIND_CONFIG}}
        fi
      - kubectl config use-context kind-{{.KIND_CLUSTER}}

  k8s:cluster:delete:
    desc: "Delete the local kind cluster"
    cmds:
      - kind delete cluster --name {{.KIND_CLUSTER}}

  k8s:images:
    desc: "Build shortener, identity, and analytics images and load them into kind"
    cmds:
      - docker build -t {{.SHORTENER_IMAGE}} -f services/shortener/Dockerfile .
      - docker build -t {{.IDENTITY_IMAGE}} -f services/identity/Dockerfile .
      - docker build -t {{.ANALYTICS_IMAGE}} -f services/analytics/Dockerfile .
      - kind load docker-image --name {{.KIND_CLUSTER}} {{.SHORTENER_IMAGE}} {{.IDENTITY_IMAGE}} {{.ANALYTICS_IMAGE}}

  k8s:template:
    desc: "Render the Helm chart for the local kind values"
    cmds:
      - helm template {{.HELM_RELEASE}} {{.HELM_CHART}} --namespace {{.K8S_NAMESPACE}} -f {{.HELM_CHART}}/values-kind.yaml

  k8s:deploy:
    desc: "Deploy shortener and analytics to local kind with Helm"
    cmds:
      - task: k8s:dependencies
      - task: k8s:cluster:create
      - task: k8s:images
      - |
        helm upgrade --install {{.HELM_RELEASE}} {{.HELM_CHART}} \
          --namespace {{.K8S_NAMESPACE}} \
          --create-namespace \
          -f {{.HELM_CHART}}/values-kind.yaml
      - kubectl -n {{.K8S_NAMESPACE}} rollout status deployment/{{.HELM_RELEASE}}-shortener --timeout=180s
      - kubectl -n {{.K8S_NAMESPACE}} rollout status deployment/{{.HELM_RELEASE}}-analytics --timeout=180s
      - task: k8s:smoke

  k8s:smoke:
    desc: "Run HTTP smoke checks against the local kind deployment"
    cmds:
      - |
        set -eu
        check_url() {
          name="$1"
          url="$2"
          echo "Checking ${name} at ${url}"
          attempt=1
          while [ "$attempt" -le 30 ]; do
            if curl -fsS "$url" >/dev/null; then
              echo "${name} is ready"
              return 0
            fi
            sleep 2
            attempt=$((attempt + 1))
          done
          echo "${name} failed smoke check: ${url}" >&2
          return 1
        }

        check_url shortener http://localhost:18080/health/ready
        check_url analytics http://localhost:19090/health/ready

  k8s:status:
    desc: "Show local kind Kubernetes resources"
    cmds:
      - kubectl -n {{.K8S_NAMESPACE}} get pods,svc,deploy

  k8s:logs:
    desc: "Tail shortener and analytics logs from the local kind deployment"
    cmds:
      - kubectl -n {{.K8S_NAMESPACE}} logs deploy/{{.HELM_RELEASE}}-shortener --all-containers --tail=100
      - kubectl -n {{.K8S_NAMESPACE}} logs deploy/{{.HELM_RELEASE}}-analytics --all-containers --tail=100

  k8s:generate-logs:
    desc: "Generate shortener pod logs through the local kind NodePort"
    cmds:
      - |
        set -eu
        base_url="${BASE_URL:-http://localhost:18080}"
        create_count="${LOG_CREATE_COUNT:-8}"
        missing_count="${LOG_MISSING_COUNT:-30}"
        rate_limit_count="${LOG_RATE_LIMIT_COUNT:-20}"
        run_id="$(date +%s)-$$"

        echo "Generating ${create_count} create+redirect requests at ${base_url}"
        for i in $(seq 1 "$create_count"); do
          code=$(curl -sS -X POST "${base_url}/api/v1/links" \
            -H 'Content-Type: application/json' \
            -H "Idempotency-Key: log-test-${run_id}-${i}" \
            -d '{"original_url":"https://example.invalid/k8s-log-target","title":"k8s-log-test","max_clicks":0}' \
            | sed -n 's/.*"short_code":"\([^"]*\)".*/\1/p')

          if [ -n "$code" ]; then
            curl -sS -o /dev/null "${base_url}/${code}"
          fi
        done

        echo "Generating ${missing_count} not-found redirects"
        for i in $(seq 1 "$missing_count"); do
          curl -sS -o /dev/null "${base_url}/missing-${run_id}-${i}"
        done

        echo "Generating ${rate_limit_count} create attempts to exercise rate-limit logs"
        for i in $(seq 1 "$rate_limit_count"); do
          curl -sS -o /dev/null -X POST "${base_url}/api/v1/links" \
            -H 'Content-Type: application/json' \
            -H "Idempotency-Key: rate-limit-${run_id}-${i}" \
            -d '{"original_url":"https://example.invalid/rate-limit-target","title":"rate-limit-test","max_clicks":0}'
        done

        echo "Done. Inspect logs with:"
        echo "kubectl -n {{.K8S_NAMESPACE}} logs deploy/{{.HELM_RELEASE}}-shortener | grep -E 'link_create|redirect|not_found|rate_limited'"

  k8s:reset:
    desc: "Uninstall the Helm release and delete the local kind cluster"
    cmds:
      - |
        if kind get clusters | grep -qx '{{.KIND_CLUSTER}}'; then
          kubectl config use-context kind-{{.KIND_CLUSTER}}
          helm uninstall {{.HELM_RELEASE}} --namespace {{.K8S_NAMESPACE}} --ignore-not-found || true
          kind delete cluster --name {{.KIND_CLUSTER}}
        else
          echo "kind cluster {{.KIND_CLUSTER}} does not exist"
        fi

  stop:
    desc: "Stop and remove the local Docker Compose stack"
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} down

  reset:
    desc: "Destroy the local Docker Compose stack and volumes"
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} down -v --remove-orphans
