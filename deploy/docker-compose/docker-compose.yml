services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
      POSTGRES_DB: shortener
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    ports:
      - "29092:29092"
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-init:
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic link.visited.v1 --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic link.visited.v1.dlq --partitions 1 --replication-factor 1
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: analytics
    volumes:
      - ../../services/analytics/migrations/clickhouse/init:/docker-entrypoint-initdb.d
      - ../../services/analytics/env/clickhouse/users.d/local-dev-default-user.xml:/etc/clickhouse-server/users.d/local-dev-default-user.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      shortener:
        condition: service_started
      identity:
        condition: service_started
      analytics:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10

  tempo:
    image: grafana/tempo:2.6.1
    user: "0:0"
    command:
      - -config.file=/etc/tempo/tempo.yml
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/tmp/tempo
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:11.2.2
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 15

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: postgres://shortener:shortener@postgres:5432/shortener?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  fluent-bit:
    image: fluent/fluent-bit:3.1
    ports:
      - "24224:24224"
    volumes:
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

  shortener:
    build:
      context: ../..
      dockerfile: services/shortener/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ../../.env
    environment:
      DB_DSN: postgres://shortener:shortener@postgres:5432/shortener?sslmode=disable
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
      KAFKA_PRODUCER_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: tempo:4318
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      tempo:
        condition: service_healthy
      fluent-bit:
        condition: service_started
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        fluentd-async: "true"
        tag: "shortener.{{.Name}}"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  identity:
    build:
      context: ../..
      dockerfile: services/identity/Dockerfile
    ports:
      - "8081:8081"
    env_file:
      - ../../.env
    environment:
      IDENTITY_APP_PORT: "8081"
      DB_DSN: postgres://shortener:shortener@postgres:5432/shortener?sslmode=disable
      IDENTITY_PUBLIC_BASE_URL: http://localhost:8081
      WEB_ORIGIN: http://localhost:${WEB_PORT:-3000}
      WEB_AUTH_CALLBACK_URL: http://localhost:${WEB_PORT:-3000}/auth/callback
      IDENTITY_COOKIE_SECURE: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: tempo:4318
    depends_on:
      identity-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      tempo:
        condition: service_healthy
      fluent-bit:
        condition: service_started
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        fluentd-async: "true"
        tag: "identity.{{.Name}}"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ../..
      dockerfile: services/web/Dockerfile
    ports:
      - "${WEB_PORT:-3000}:3000"
    env_file:
      - ../../.env
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://shortener:8080
      NEXT_PUBLIC_IDENTITY_API_BASE_URL: http://localhost:8081
      ANALYTICS_API_BASE_URL: http://analytics:9090
    depends_on:
      shortener:
        condition: service_healthy
      identity:
        condition: service_healthy
      analytics:
        condition: service_healthy

  analytics:
    build:
      context: ../..
      dockerfile: services/analytics/Dockerfile
    ports:
      - "9090:9090"
    env_file:
      - ../../.env
    environment:
      ANALYTICS_ADMIN_PORT: "9090"
      KAFKA_BROKERS: kafka:9092
      KAFKA_CONSUMER_ENABLED: "true"
      CLICKHOUSE_ADDR: clickhouse:9000
      OTEL_EXPORTER_OTLP_ENDPOINT: tempo:4318
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      tempo:
        condition: service_healthy
      fluent-bit:
        condition: service_started
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        fluentd-async: "true"
        tag: "analytics.{{.Name}}"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ../../services/shortener/migrations/postgres:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://shortener:shortener@postgres:5432/shortener?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  identity-migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ../../services/identity/migrations/postgres:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://shortener:shortener@postgres:5432/shortener?sslmode=disable&x-migrations-table=schema_migrations_identity"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  mcp-logs:
    build:
      context: ../..
      dockerfile: services/mcp-logs/Dockerfile
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      MCP_LOGS_TRANSPORT: http
      MCP_LOGS_HTTP_ADDRESS: 0.0.0.0:8090
      MCP_LOGS_HTTP_HOSTS: localhost:8090,127.0.0.1:8090
      MCP_LOGS_ELASTICSEARCH_URL: http://elasticsearch:9200
      MCP_LOGS_TEMPO_URL: http://tempo:3200
      MCP_LOGS_POSTGRES_DSN: postgres://mcp_reader:mcp_reader_local@postgres:5432/shortener?sslmode=disable
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  mcp-db-prepare:
    image: postgres:18-alpine
    profiles: [tools]
    environment:
      PGPASSWORD: shortener
    volumes:
      - ../../services/mcp-logs/migrations/postgres/prepare-reader.sql:/prepare-reader.sql:ro
    command: ["psql", "-h", "postgres", "-U", "shortener", "-d", "shortener", "-f", "/prepare-reader.sql"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  k6:
    image: grafana/k6:1.7.1
    profiles:
      - tools
    working_dir: /scripts
    volumes:
      - ../../load/k6:/scripts:ro
    environment:
      BASE_URL: http://shortener:8080
      DURATION: 30s
      VUS: "5"
      LINK_POOL_SIZE: "5"
      CREATE_WEIGHT: "0.02"
      REQUEST_DELAY_SECONDS: "1"
      CREATE_CLIENT_IP_POOL: "20"
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: p(95),p(99),min,max
      K6_PROMETHEUS_RW_STALE_MARKERS: "true"
    depends_on:
      shortener:
        condition: service_healthy
      prometheus:
        condition: service_healthy

volumes:
  pg_data:
  es_data:
  prometheus_data:
  tempo_data:
  grafana_data:
