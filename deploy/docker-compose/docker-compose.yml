services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
      POSTGRES_DB: shortener
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  shortener:
    build:
      context: ../..
      dockerfile: services/shortener/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ../../.env
    environment:
      DB_DSN: postgres://shortener:shortener@postgres:5432/shortener?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  analytics:
    build:
      context: ../..
      dockerfile: services/analytics/Dockerfile
    ports:
      - "9090:9090"
    env_file:
      - ../../.env
    environment:
      ANALYTICS_ADMIN_PORT: "9090"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ../../services/shortener/migrations/postgres:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://shortener:shortener@postgres:5432/shortener?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

volumes:
  pg_data:
