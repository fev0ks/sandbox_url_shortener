services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
      POSTGRES_DB: shortener
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    ports:
      - "29092:29092"
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-init:
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic link.visited.v1 --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic link.visited.v1.dlq --partitions 1 --replication-factor 1
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: analytics
    volumes:
      - ../../services/analytics/migrations/clickhouse/init:/docker-entrypoint-initdb.d
      - ../../services/analytics/env/clickhouse/users.d/local-dev-default-user.xml:/etc/clickhouse-server/users.d/local-dev-default-user.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  shortener:
    build:
      context: ../..
      dockerfile: services/shortener/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ../../.env
    environment:
      DB_DSN: postgres://shortener:shortener@postgres:5432/shortener?sslmode=disable
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
      KAFKA_PRODUCER_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ../..
      dockerfile: services/web/Dockerfile
    ports:
      - "${WEB_PORT:-3000}:3000"
    env_file:
      - ../../.env
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://shortener:8080
      ANALYTICS_API_BASE_URL: http://analytics:9090
    depends_on:
      shortener:
        condition: service_healthy
      analytics:
        condition: service_healthy

  analytics:
    build:
      context: ../..
      dockerfile: services/analytics/Dockerfile
    ports:
      - "9090:9090"
    env_file:
      - ../../.env
    environment:
      ANALYTICS_ADMIN_PORT: "9090"
      KAFKA_BROKERS: kafka:9092
      KAFKA_CONSUMER_ENABLED: "true"
      CLICKHOUSE_ADDR: clickhouse:9000
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ../../services/shortener/migrations/postgres:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://shortener:shortener@postgres:5432/shortener?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

volumes:
  pg_data:
