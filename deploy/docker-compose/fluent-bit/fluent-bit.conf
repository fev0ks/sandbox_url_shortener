[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    Parsers_File /fluent-bit/etc/parsers.conf
    HTTP_Server  On
    HTTP_Listen  0.0.0.0
    HTTP_Port    2020

[INPUT]
    Name         forward
    Listen       0.0.0.0
    Port         24224

[FILTER]
    Name         parser
    Match        shortener.*
    Key_Name     log
    Parser       app_json
    Reserve_Data On
    Preserve_Key Off

[FILTER]
    Name         parser
    Match        analytics.*
    Key_Name     log
    Parser       app_json
    Reserve_Data On
    Preserve_Key Off

[FILTER]
    Name         parser
    Match        identity.*
    Key_Name     log
    Parser       app_json
    Reserve_Data On
    Preserve_Key Off

[OUTPUT]
    Name               es
    Match              *
    Host               elasticsearch
    Port               9200
    Logstash_Format    On
    Logstash_Prefix    shortener-logs
    Suppress_Type_Name On
    Replace_Dots       On
    Retry_Limit        False
