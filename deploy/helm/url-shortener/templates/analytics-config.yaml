apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "url-shortener.serviceName" (dict "root" . "service" "analytics") }}-config
  labels:
    {{- include "url-shortener.labels" . | nindent 4 }}
    app.kubernetes.io/component: analytics
data:
  APP_ENV: {{ .Values.global.appEnv | quote }}
  {{- range $key, $value := .Values.analytics.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "url-shortener.serviceName" (dict "root" . "service" "analytics") }}-secret
  labels:
    {{- include "url-shortener.labels" . | nindent 4 }}
    app.kubernetes.io/component: analytics
type: Opaque
stringData:
  {{- range $key, $value := .Values.analytics.secretEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
