version: "2"

run:
  timeout: 5m
  relative-path-mode: gomod
  issues-exit-code: 1
  tests: true
  modules-download-mode: readonly

output:
  formats:
    text:
      print-linter-name: true
      print-issued-lines: true
      colors: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: true

linters:
  default: none
  enable:
    - errcheck
    - staticcheck
    - govet
    - gocritic
    - revive
    - unused
    - gosec
    - depguard
    - bodyclose
    - asciicheck
    - cyclop
    - dupl
    - ineffassign
    - unparam
    - errorlint
    - errname
    - forbidigo
    - contextcheck
    - containedctx
  disable:
    - gocyclo
    - lll
  exclusions:
    generated: strict
    rules:
      - path: _test\.go
        linters:
          - cyclop
          - dupl
          - gosec
  settings:
    gosec:
      config:
        global:
          audit: true
          show-ignored: true
        severity: "medium"
        confidence: "medium"
    cyclop:
      max-complexity: 20
    depguard:
      rules:
        main:
          deny:
            - pkg: io/ioutil
              desc: "Do not use deprecated io/ioutil; use os/io replacements"
    revive:
      severity: warning
    forbidigo:
      exclude-godoc-examples: true
      analyze-types: true
      forbid:
        - pattern: '^fmt\.Print.*$'
          msg: "Do not use fmt.Print* for logging; use the project logger or explicit test output"
        - pattern: '^time\.Sleep$'
          msg: "Do not use time.Sleep in production code; prefer timers or context-driven waiting"
        - pattern: '^http\.DefaultClient$'
          msg: "Do not use http.DefaultClient; create an *http.Client with explicit timeouts"
